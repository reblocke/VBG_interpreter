[project]
name = "vbg-interpreter"
version = "0.1.0"
description = "Research VBG Acid-Base Explorer with set-valued, evidence-bounded results"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  {name = "Brian Locke"},
]
keywords = ["acid-base", "blood-gas", "research-software", "vbg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "stewartlight @ git+https://github.com/reblocke/stewart-light.git@f277cac54801d85366cbadbf11804f6643f6a869",
]

[project.urls]
Homepage = "https://reblocke.github.io/VBG_interpreter/"
Repository = "https://github.com/reblocke/VBG_interpreter"
Documentation = "https://github.com/reblocke/VBG_interpreter#readme"
Issues = "https://github.com/reblocke/VBG_interpreter/issues"
Changelog = "https://github.com/reblocke/VBG_interpreter/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "playwright>=1.55,<2",
  "pytest>=8.2",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.15.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-q"]
testpaths = ["tests"]
markers = [
  "e2e: browser end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["vbg_interpreter"]

[tool.uv]
required-version = "==0.11.11"
build-constraint-dependencies = [
  "setuptools==83.0.0",
  "wheel==0.47.0",
]

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vbg_interpreter*"]
